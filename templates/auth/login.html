{% extends "base.html" %}
{% block title %}Login · FinanceAI{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="card auth-card">
    <span class="eyebrow">WELCOME BACK</span><h1>Login to FinanceAI</h1>
    <form method="post" class="form-stack">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>Email<input type="email" name="email" required></label>
      <label>Password<input type="password" name="password" required></label>
      <button class="btn primary full-btn" type="submit">Login</button>
    </form>
    <p class="muted center">New here? <a class="text-link" href="{{ url_for('register') }}">Create account</a></p>
  </div>
</section>
{% endblock %}
